name = "obsidia-eventos"
main = "src/index.js"
compatibility_date = "2025-10-01"

# ── Almacenamiento ──────────────────────────────────────────────────────────
# Usa un namespace PROPIO, no el de obsidia-share: los packs y la whitelist de
# eventos no deben mezclarse con lo que comparte la comunidad.
# Créalo con `npx wrangler kv namespace create FILES` y pega su id aquí.
[[kv_namespaces]]
binding = "FILES"
id = "07e896586a8f4a6ea49ade0a6736d18d"

# Opción B (pide tarjeta aunque sea gratis): R2. Si la activas, tiene prioridad.
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "obsidia-eventos"

[vars]
# Tamaño máximo de un archivo subido (MB). Con KV nunca pasa de 25.
MAX_FILE_MB = "25"
# Lo que puede subir cada admin al día (MB) y cuántos packs.
DAILY_UPLOAD_MB = "2000"
DAILY_PACKS = "50"
# UUIDs de los organizadores (sin guiones, separados por comas). Solo ellos
# pueden crear eventos, editar la whitelist y subir packs.
ADMIN_UUIDS = "a6e6588335244eaeb2008c74c6b27223"

# Secretos (NO van aquí):
#   npx wrangler secret put SECRET          # firma de sesiones: openssl rand -base64 48
#   npx wrangler secret put SERVER_KEY      # clave del servidor de Minecraft: openssl rand -hex 24
#   npx wrangler secret put ADMIN_PASSWORD  # panel web (12+ caracteres): openssl rand -base64 24

# Opcional: limitador de Cloudflare para el login del panel web (5 intentos por
# minuto e IP) antes de tocar KV. El bloqueo por IP funciona igual sin esto.
# [[ratelimits]]
# name = "LOGIN_LIMITER"
# namespace_id = "1001"
# simple = { limit = 5, period = 60 }
